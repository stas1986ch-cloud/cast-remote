plugins {
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
    id "com.chaquo.python" version "16.1.0" apply false
}

// Avoid Windows OneDrive file-sync locks on Gradle build intermediates.
if (rootDir.absolutePath.toLowerCase().contains("onedrive")) {
    allprojects {
        layout.buildDirectory.set(file("${System.getProperty('java.io.tmpdir')}/cast-remote-build/${project.name}"))
    }
}
