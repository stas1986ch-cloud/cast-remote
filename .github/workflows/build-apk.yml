name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CastRemote.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastRemote-apk
          path: CastRemote.apk
          retention-days: 30

      - name: Publish Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest CastRemote.apk --clobber
          else
            gh release create latest CastRemote.apk --title "Cast Remote (Latest)" --notes "Direct Android APK install build (pin favorites + TV power on/off + Cast/Mirror)."
          fi
