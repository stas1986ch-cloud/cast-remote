name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Cast Remote v3.2.0 APK
        working-directory: cast-remote
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp cast-remote/app/build/outputs/apk/debug/app-debug.apk CastRemote.apk
          cp CastRemote.apk CastRemote-v3.2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastRemote-v3.2.0-apk
          path: CastRemote-v3.2.0.apk
          retention-days: 30

      - name: Publish Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest CastRemote.apk CastRemote-v3.2.0.apk --clobber
          else
            gh release create latest CastRemote.apk CastRemote-v3.2.0.apk --title "Cast Remote v3.2.0 (Latest)" --notes "Enhanced Cast Remote v3.2.0 (built on Muse's v3.1.1): favorite device pinning, Android TV Remote v2 Power On/Off + Cast fallback, Google Home devices, and bug fixes."
          fi
