name: GoogleScreenControlAndCast
options:
  bundleIdPrefix: com.screencontrol
  deploymentTarget: "16.0"
targets:
  GoogleScreenControlAndCast:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Google Screen Control and Cast
        NSLocalNetworkUsageDescription: "Google Screen Control and Cast finds TVs and phones on your Wi-Fi to control and cast media to them."
        NSBonjourServices:
          - _googlecast._tcp
          - _233637DE._googlecast._tcp
          - _androidtvremote2._tcp
          - _castremote._tcp
        LSApplicationQueriesSchemes:
          - youtube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencontrol.cast
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
